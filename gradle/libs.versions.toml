[versions]
aliucord = "2.11.0"
aliucore-gradle = "e323d8c"
discord = "126021"
android = "8.13.2"
kotlin = "2.3.20"

[libraries]
aliucord = { module = "com.aliucord:Aliucord", version.ref = "aliucord" }
discord = { module = "com.discord:discord", version.ref = "discord" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }

[plugins]
aliucord-plugin = { id = "io.github.canny1913.plugin", version.ref = "aliucore-gradle" }
android-library = { id = "com.android.library", version.ref = "android" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }